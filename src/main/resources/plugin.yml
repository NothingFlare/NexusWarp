name: NexusWarp
version: '${project.version}'
main: me.nexuswarp.NexusWarpPlugin
api-version: '1.20'
folia-supported: true
softdepend: [Vault]
author: NothingFlare
description: Universal high-performance TPA, Teleportation, Messaging and Economy plugin for Paper, Purpur, Spigot, and Folia (1.20+)

commands:
  tpa:
    description: Запросить телепортацию к игроку / Request teleportation to a player
    usage: /tpa <player>
    permission: nexuswarp.use
  tpaccept:
    description: Принять запрос на телепортацию / Accept teleportation request
    usage: /tpaccept [player]
    aliases: [tpyes]
    permission: nexuswarp.use
  tpacancel:
    description: Отменить запрос на телепортацию / Cancel teleportation request
    usage: /tpacancel [player]
    aliases: [tpdeny, tpcancel, tpno]
    permission: nexuswarp.use
  tp:
    description: Мгновенная телепортация к игроку или координатам / Teleport to a player or coordinates
    usage: /tp <player> [target] | /tp [player] <x> <y> <z>
    aliases: [teleport]
    permission: nexuswarp.tp
  tphere:
    description: Телепортировать игрока к себе / Teleport a player to you
    usage: /tphere <player>
    aliases: [s, tph]
  msg:
    description: Отправить личное сообщение / Send a private message
    usage: /msg <player> <message>
    aliases: [w, tell, m, whisper]
    permission: nexuswarp.msg
  reply:
    description: Быстрый ответ на личное сообщение / Reply to the last private message
    usage: /reply <message>
    aliases: [r]
    permission: nexuswarp.msg
  eco:
    description: Управление балансом игроков / Manage player economy balance
    usage: /eco <give|take|set|reset> <player|*|**> [amount]
    aliases: [economy]
    permission: nexuswarp.eco
  balance:
    description: Посмотреть баланс / Check account balance
    usage: /balance [player]
    aliases: [bal, money]
    permission: nexuswarp.balance
  bal:
    description: Посмотреть баланс / Check account balance
    usage: /bal [player]
    permission: nexuswarp.balance
  pay:
    description: Перевести деньги другому игроку / Transfer money to another player
    usage: /pay <player|*> <amount>
    permission: nexuswarp.pay
  balancetop:
    description: Топ богатых игроков сервера / Top richest players leaderboard
    usage: /balancetop [page|force]
    aliases: [baltop]
    permission: nexuswarp.balancetop
  baltop:
    description: Топ богатых игроков сервера / Top richest players leaderboard
    usage: /baltop [page|force]
    permission: nexuswarp.balancetop
  paytoggle:
    description: Переключить прием денежных переводов / Toggle receiving payments
    usage: /paytoggle [on|off|player]
    aliases: [payon, payoff]
    permission: nexuswarp.paytoggle
  payconfirmtoggle:
    description: Переключить подтверждение переводов / Toggle payment confirmation
    usage: /payconfirmtoggle [on|off]
    aliases: [payconfirmon, payconfirmoff]
    permission: nexuswarp.payconfirmtoggle
  playtime:
    description: Посмотреть время в игре / Check player playtime
    usage: /playtime [player]
    aliases: [ontime, pt]
    permission: nexuswarp.playtime
  seen:
    description: Проверить последний онлайн игрока / Check player last seen information
    usage: /seen <player>
    permission: nexuswarp.seen
  list:
    description: Список игроков в сети / List all online players
    usage: /list [group]
    aliases: [online, playerlist, plist, who]
    permission: nexuswarp.list
  spawn:
    description: Телепортация на спавн / Teleport to spawn location
    usage: /spawn [player]
    permission: nexuswarp.spawn
  hub:
    description: Телепортация в хаб / Teleport to hub location
    usage: /hub [player]
    aliases: [lobby]
    permission: nexuswarp.hub
  setspawn:
    description: Установить точку спавна / Set spawn location
    usage: /setspawn
    permission: nexuswarp.setspawn
  sethub:
    description: Установить точку хаба / Set hub location
    usage: /sethub
    aliases: [setlobby]
    permission: nexuswarp.sethub
  fly:
    description: Переключить режим полёта / Toggle flight mode
    usage: /fly [player] [on|off]
    permission: nexuswarp.fly
  heal:
    description: Полностью исцелить и утолить голод / Heal and feed player
    usage: /heal [player|*]
    permission: nexuswarp.heal
  kill:
    description: Убить игрока / Kill a player
    usage: /kill <player>
    permission: nexuswarp.kill
  killall:
    description: Удалить сущности в мире (дроп, мобы, стрелы и т.д.) / Remove entities in world
    usage: /killall <drops|mobs|monsters|animals|xp|arrows|boats|all> [радиус|мир]
    aliases: [remove, butcher, mobkill]
    permission: nexuswarp.killall
  remove:
    description: Удалить сущности в мире / Remove entities in world
    usage: /remove <drops|mobs|monsters|animals|xp|arrows|boats|all> [радиус|мир]
    permission: nexuswarp.killall
  butcher:
    description: Удалить сущности в мире / Remove entities in world
    usage: /butcher <drops|mobs|monsters|animals|xp|arrows|boats|all> [радиус|мир]
    permission: nexuswarp.killall
  mute:
    description: Заглушить игрока / Mute a player
    usage: /mute <player> [duration] [reason]
    permission: nexuswarp.mute
  unmute:
    description: Снять заглушку с игрока / Unmute a player
    usage: /unmute <player>
    permission: nexuswarp.mute
  tempban:
    description: Временно заблокировать игрока / Temporarily ban a player
    usage: /tempban <player> <time> [reason]
    permission: nexuswarp.tempban
  uptime:
    description: Статистика работы сервера / Check server uptime and performance
    usage: /uptime
    aliases: [lag, gc, mem]
    permission: nexuswarp.uptime
  nexuswarp:
    description: Управление плагином NexusWarp / NexusWarp management command
    usage: /nexuswarp [reload]
    aliases: [nw, tpreload]
    permission: nexuswarp.admin

permissions:
  nexuswarp.use:
    description: Доступ ко всем базовым командам TPA / Access to base TPA commands
    default: true
  nexuswarp.msg:
    description: Доступ к отправке личных сообщений / Access to private messaging
    default: true
  nexuswarp.tp:
    description: Доступ к прямой телепортации / Access to direct teleportation
    default: op
  essentials.tp:
    description: Доступ к прямой телепортации (Essentials bridge) / Access to direct teleportation
    default: op
  nexuswarp.tphere:
    description: Доступ к телепортации игрока к себе / Teleport player to you
    default: op
  essentials.tphere:
    description: Доступ к телепортации игрока к себе (Essentials bridge) / Teleport player to you
    default: op
  nexuswarp.tp.others:
    description: Доступ к телепортации других игроков / Access to teleport other players
    default: op
  nexuswarp.tp.position:
    description: Доступ к телепортации по координатам / Access to teleport to coordinates
    default: op
  nexuswarp.eco:
    description: Доступ к управлению экономикой / Access to economy management command
    default: op
  nexuswarp.eco.loan:
    description: Разрешение на отрицательный баланс (кредит) / Allow negative balance loan
    default: false
  nexuswarp.balance:
    description: Доступ к просмотру своего баланса / Access to check own balance
    default: true
  nexuswarp.balance.others:
    description: Доступ к просмотру баланса других игроков / Access to check other players balance
    default: op
  nexuswarp.pay:
    description: Доступ к переводу денег / Access to transfer money
    default: true
  nexuswarp.pay.multiple:
    description: Доступ к переводу денег всем игрокам (/pay *) / Pay all players
    default: op
  nexuswarp.pay.offline:
    description: Доступ к переводу денег оффлайн игрокам / Pay offline players
    default: op
  nexuswarp.paytoggle:
    description: Переключение приема платежей / Toggle receiving payments
    default: true
  nexuswarp.paytoggle.others:
    description: Переключение приема платежей другим игрокам / Toggle receiving payments for others
    default: op
  nexuswarp.payconfirmtoggle:
    description: Переключение подтверждения переводов / Toggle payment confirmation
    default: true
  nexuswarp.balancetop:
    description: Доступ к просмотру топа богачей / Access to balance top
    default: true
  nexuswarp.balancetop.force:
    description: Принудительное обновление топа богачей (/baltop force) / Force baltop recalculation
    default: op
  nexuswarp.balancetop.exclude:
    description: Исключение из топа богачей / Exclude from balance top ranking
    default: false
  essentials.balancetop.exclude:
    description: Исключение из топа богачей (Essentials bridge) / Exclude from balance top ranking
    default: false
  nexuswarp.playtime:
    description: Доступ к просмотру своего игрового времени / Access to check own playtime
    default: true
  nexuswarp.playtime.others:
    description: Доступ к просмотру игрового времени других игроков / Access to check other players playtime
    default: op
  nexuswarp.seen:
    description: Доступ к команде /seen / Access to /seen command
    default: true
  nexuswarp.seen.ip:
    description: Доступ к просмотру IP в /seen / Access to see IP in /seen
    default: op
  nexuswarp.seen.location:
    description: Доступ к просмотру локации в /seen / Access to see location in /seen
    default: op
  nexuswarp.seen.uuid:
    description: Доступ к просмотру UUID в /seen / Access to see UUID in /seen
    default: true
  nexuswarp.seen.firstlogin:
    description: Доступ к просмотру первого входа в /seen / Access to see first login in /seen
    default: true
  nexuswarp.seen.banreason:
    description: Доступ к просмотру причины бана в /seen / Access to see ban reason in /seen
    default: true
  nexuswarp.list:
    description: Доступ к списку игроков / Access to /list command
    default: true
  essentials.list:
    description: Доступ к списку игроков (Essentials bridge) / Access to /list command
    default: true
  nexuswarp.list.hidden:
    description: Просмотр скрытых игроков в /list / Access to view hidden players in /list
    default: op
  essentials.list.hidden:
    description: Просмотр скрытых игроков в /list (Essentials bridge) / Access to view hidden players in /list
    default: op
  nexuswarp.spawn:
    description: Доступ к команде /spawn / Access to /spawn command
    default: true
  essentials.spawn:
    description: Доступ к команде /spawn (Essentials bridge) / Access to /spawn command
    default: true
  nexuswarp.spawn.others:
    description: Телепортация других игроков на спавн / Teleport other players to spawn
    default: op
  nexuswarp.hub:
    description: Доступ к команде /hub / Access to /hub command
    default: true
  essentials.hub:
    description: Доступ к команде /hub (Essentials bridge) / Access to /hub command
    default: true
  nexuswarp.hub.others:
    description: Телепортация других игроков в хаб / Teleport other players to hub
    default: op
  nexuswarp.setspawn:
    description: Установка точки спавна / Access to /setspawn command
    default: op
  nexuswarp.sethub:
    description: Установка точки хаба / Access to /sethub command
    default: op
  nexuswarp.bypass.world:
    description: Обход запрета телепортации в отключенных мирах / Bypass disabled worlds
    default: false
  nexuswarp.bypass.delay:
    description: Мгновенная телепортация без ожидания / Bypass teleport warmup delay
    default: op
  nexuswarp.admin:
    description: Доступ к административным командам / Access to admin commands
    default: op
  nexuswarp.fly:
    description: Доступ к полету (/fly) / Access to /fly command
    default: op
  essentials.fly:
    description: Доступ к полету (Essentials bridge) / Access to /fly command
    default: op
  nexuswarp.fly.others:
    description: Включение полета другим игрокам / Access to /fly for other players
    default: op
  essentials.fly.others:
    description: Включение полета другим игрокам (Essentials bridge) / Access to /fly for other players
    default: op
  nexuswarp.heal:
    description: Доступ к исцелению (/heal) / Access to /heal command
    default: op
  essentials.heal:
    description: Доступ к исцелению (Essentials bridge) / Access to /heal command
    default: op
  nexuswarp.heal.others:
    description: Исцеление других игроков (/heal <player>) / Access to heal other players
    default: op
  essentials.heal.others:
    description: Исцеление других игроков (Essentials bridge) / Access to heal other players
    default: op
  nexuswarp.heal.cooldown.bypass:
    description: Обход задержки на использование /heal / Bypass heal cooldown
    default: op
  essentials.heal.cooldown.bypass:
    description: Обход задержки на использование /heal (Essentials bridge) / Bypass heal cooldown
    default: op
  nexuswarp.kill:
    description: Доступ к убийству игроков (/kill) / Access to /kill command
    default: op
  essentials.kill:
    description: Доступ к убийству игроков (Essentials bridge) / Access to /kill command
    default: op
  nexuswarp.kill.exempt:
    description: Иммунитет к команде /kill / Immune to /kill command
    default: false
  essentials.kill.exempt:
    description: Иммунитет к команде /kill (Essentials bridge) / Immune to /kill command
    default: false
  nexuswarp.kill.force:
    description: Убийство защищенных игроков (/kill) / Force kill exempt players
    default: op
  essentials.kill.force:
    description: Убийство защищенных игроков (Essentials bridge) / Force kill exempt players
    default: op
  nexuswarp.killall:
    description: Доступ к удалению сущностей (/killall, /remove) / Access to /killall command
    default: op
  essentials.killall:
    description: Доступ к удалению сущностей (Essentials bridge) / Access to /killall command
    default: op
  nexuswarp.remove:
    description: Доступ к удалению сущностей (/remove) / Access to /remove command
    default: op
  essentials.remove:
    description: Доступ к удалению сущностей (Essentials bridge) / Access to /remove command
    default: op
  nexuswarp.mute:
    description: Доступ к заглушению игроков (/mute, /unmute) / Access to /mute and /unmute
    default: op
  essentials.mute:
    description: Доступ к заглушению игроков (Essentials bridge) / Access to /mute and /unmute
    default: op
  nexuswarp.mute.exempt:
    description: Иммунитет к заглушению (/mute) / Immune to /mute command
    default: false
  essentials.mute.exempt:
    description: Иммунитет к заглушению (Essentials bridge) / Immune to /mute command
    default: false
  nexuswarp.tempban:
    description: Доступ к временному бану (/tempban) / Access to /tempban command
    default: op
  essentials.tempban:
    description: Доступ к временному бану (Essentials bridge) / Access to /tempban command
    default: op
  nexuswarp.tempban.exempt:
    description: Иммунитет к временному бану / Immune to /tempban command
    default: false
  essentials.tempban.exempt:
    description: Иммунитет к временному бану (Essentials bridge) / Immune to /tempban command
    default: false
  nexuswarp.uptime:
    description: Доступ к статистике сервера (/uptime) / Access to /uptime command
    default: op
  essentials.uptime:
    description: Доступ к статистике сервера (Essentials bridge) / Access to /uptime command
    default: op
