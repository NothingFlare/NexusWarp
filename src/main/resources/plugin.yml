name: NexusWarp
version: '${project.version}'
main: me.nexuswarp.NexusWarpPlugin
api-version: '1.20'
folia-supported: true
softdepend: [Vault]
author: NothingFlare
description: Universal high-performance TPA, Teleportation, Messaging and Economy plugin for Paper, Purpur, Spigot, and Folia (1.20+)

commands:
  tpa:
    description: Запросить телепортацию к игроку / Request teleportation to a player
    usage: /tpa <player>
    permission: nexuswarp.use
  tpaccept:
    description: Принять запрос на телепортацию / Accept teleportation request
    usage: /tpaccept [player]
    aliases: [tpyes]
    permission: nexuswarp.use
  tpacancel:
    description: Отменить запрос на телепортацию / Cancel teleportation request
    usage: /tpacancel [player]
    aliases: [tpdeny, tpcancel, tpno]
    permission: nexuswarp.use
  tp:
    description: Мгновенная телепортация к игроку или координатам / Teleport to a player or coordinates
    usage: /tp <player> [target] | /tp [player] <x> <y> <z>
    aliases: [teleport]
    permission: nexuswarp.tp
  tphere:
    description: Телепортировать игрока к себе / Teleport a player to you
    usage: /tphere <player>
    aliases: [s, tph]
    permission: nexuswarp.tphere
  msg:
    description: Отправить личное сообщение / Send a private message
    usage: /msg <player> <message>
    aliases: [w, tell, m, whisper]
    permission: nexuswarp.msg
  reply:
    description: Быстрый ответ на личное сообщение / Reply to the last private message
    usage: /reply <message>
    aliases: [r]
    permission: nexuswarp.msg
  eco:
    description: Управление балансом игроков / Manage player economy balance
    usage: /eco <give|take|set|reset> <player|*|**> [amount]
    aliases: [economy]
    permission: nexuswarp.eco
  balance:
    description: Посмотреть баланс / Check account balance
    usage: /balance [player]
    aliases: [bal, money]
    permission: nexuswarp.balance
  bal:
    description: Посмотреть баланс / Check account balance
    usage: /bal [player]
    permission: nexuswarp.balance
  pay:
    description: Перевести деньги другому игроку / Transfer money to another player
    usage: /pay <player|*> <amount>
    permission: nexuswarp.pay
  balancetop:
    description: Топ богатых игроков сервера / Top richest players leaderboard
    usage: /balancetop [page|force]
    aliases: [baltop]
    permission: nexuswarp.balancetop
  baltop:
    description: Топ богатых игроков сервера / Top richest players leaderboard
    usage: /baltop [page|force]
    permission: nexuswarp.balancetop
  paytoggle:
    description: Переключить прием денежных переводов / Toggle receiving payments
    usage: /paytoggle [on|off|player]
    aliases: [payon, payoff]
    permission: nexuswarp.paytoggle
  payconfirmtoggle:
    description: Переключить подтверждение переводов / Toggle payment confirmation
    usage: /payconfirmtoggle [on|off]
    aliases: [payconfirmon, payconfirmoff]
    permission: nexuswarp.payconfirmtoggle
  spawn:
    description: Телепортация на спавн / Teleport to spawn location
    usage: /spawn [player]
    permission: nexuswarp.spawn
  hub:
    description: Телепортация в хаб / Teleport to hub location
    usage: /hub [player]
    aliases: [lobby]
    permission: nexuswarp.hub
  setspawn:
    description: Установить точку спавна / Set spawn location
    usage: /setspawn
    permission: nexuswarp.setspawn
  sethub:
    description: Установить точку хаба / Set hub location
    usage: /sethub
    aliases: [setlobby]
    permission: nexuswarp.sethub
  nexuswarp:
    description: Управление плагином NexusWarp / NexusWarp management command
    usage: /nexuswarp [reload]
    aliases: [nw, tpreload]
    permission: nexuswarp.admin

permissions:
  nexuswarp.use:
    description: Доступ ко всем базовым командам TPA / Access to base TPA commands
    default: true
  nexuswarp.msg:
    description: Доступ к отправке личных сообщений / Access to private messaging
    default: true
  nexuswarp.tp:
    description: Доступ к прямой телепортации / Access to direct teleportation
    default: false
  nexuswarp.tphere:
    description: Доступ к телепортации игрока к себе / Teleport player to you
    default: false
  nexuswarp.tp.others:
    description: Доступ к телепортации других игроков / Access to teleport other players
    default: false
  nexuswarp.tp.position:
    description: Доступ к телепортации по координатам / Access to teleport to coordinates
    default: false
  nexuswarp.eco:
    description: Доступ к управлению экономикой / Access to economy management command
    default: op
  nexuswarp.eco.loan:
    description: Разрешение на отрицательный баланс (кредит) / Allow negative balance loan
    default: false
  nexuswarp.balance:
    description: Доступ к просмотру своего баланса / Access to check own balance
    default: true
  nexuswarp.balance.others:
    description: Доступ к просмотру баланса других игроков / Access to check other players balance
    default: op
  nexuswarp.pay:
    description: Доступ к переводу денег / Access to transfer money
    default: true
  nexuswarp.pay.multiple:
    description: Доступ к переводу денег всем игрокам (/pay *) / Pay all players
    default: op
  nexuswarp.pay.offline:
    description: Доступ к переводу денег оффлайн игрокам / Pay offline players
    default: op
  nexuswarp.paytoggle:
    description: Переключение приема платежей / Toggle receiving payments
    default: true
  nexuswarp.paytoggle.others:
    description: Переключение приема платежей другим игрокам / Toggle receiving payments for others
    default: op
  nexuswarp.payconfirmtoggle:
    description: Переключение подтверждения переводов / Toggle payment confirmation
    default: true
  nexuswarp.balancetop:
    description: Доступ к просмотру топа богачей / Access to balance top
    default: true
  nexuswarp.balancetop.force:
    description: Принудительное обновление топа богачей (/baltop force) / Force baltop recalculation
    default: op
  nexuswarp.balancetop.exclude:
    description: Исключение из топа богачей / Exclude from balance top ranking
    default: false
  nexuswarp.spawn:
    description: Доступ к команде /spawn / Access to /spawn command
    default: true
  nexuswarp.spawn.others:
    description: Телепортация других игроков на спавн / Teleport other players to spawn
    default: op
  nexuswarp.hub:
    description: Доступ к команде /hub / Access to /hub command
    default: true
  nexuswarp.hub.others:
    description: Телепортация других игроков в хаб / Teleport other players to hub
    default: op
  nexuswarp.setspawn:
    description: Установка точки спавна / Access to /setspawn command
    default: op
  nexuswarp.sethub:
    description: Установка точки хаба / Access to /sethub command
    default: op
  nexuswarp.bypass.world:
    description: Обход запрета телепортации в отключенных мирах / Bypass disabled worlds
    default: false
  nexuswarp.bypass.delay:
    description: Мгновенная телепортация без ожидания / Bypass teleport warmup delay
    default: op
  nexuswarp.admin:
    description: Доступ к административным командам / Access to admin commands
    default: op
