# =======================================================
#               NexusWarp Plugin Configuration
# =======================================================

# Language / Язык плагина
# Supported: en, ru, zh, de, fr, es, pt, ja, uk, it, pl, tr, ko
language: "ru"

# Updates configuration / Проверка обновлений
updates:
  # Check for updates on startup via GitHub
  # Проверять наличие обновлений на GitHub при запуске
  check-for-updates: true

# Economy configuration / Настройка экономики
economy:
  # Enable NexusWarp internal economy system
  # Включить встроенную экономику NexusWarp
  enabled: true

  # Defines the balance new players start with
  # Начальный баланс новых игроков
  starting-balance: 0.00

  # Minimum amount of money a player can have (e.g. 0.00 or -10000.00)
  # Players need 'nexuswarp.eco.loan' permission to have a negative balance
  # Минимальный баланс игрока (для отрицательного баланса нужно право 'nexuswarp.eco.loan')
  min-balance: 0.00

  # Maximum amount of money a player can have
  # Максимальный баланс игрока
  max-balance: 10000000000000.00

  # Currency symbol / Символ валюты
  currency-symbol: "$"

  # Enable this to make the currency symbol appear at the end of the amount (e.g. 500$ vs $500)
  # Размещать символ валюты позади суммы (например, 500$ вместо $500)
  currency-symbol-placed-behind: false

  # Minimum amount allowed for /pay command
  # Минимальная сумма для перевода командой /pay
  minimum-pay-amount: 0.01

  # Balancetop cache update interval in seconds (default: 60)
  # Интервал автоматического обновления топа богачей (/baltop) в секундах (по умолчанию: 60)
  baltop-update-interval: 60

  # Whether players with balance 0 or less should be shown in /baltop
  # Показывать ли игроков с балансом 0 или меньше в /baltop
  baltop-show-zero: true

  # Minimum balance required to appear in /baltop
  # Минимальный баланс для попадания в /baltop
  baltop-min-balance: 0.00

  # Maximum number of players cached in /baltop (-1 for unlimited)
  # Максимальное количество игроков в топе (-1 без ограничений)
  baltop-entry-limit: -1

  # Show NPC accounts in /baltop
  # Показывать ли NPC аккаунты в топе богачей
  baltop-show-npcs: false

# Spawn command configuration / Настройка точки спавна (/spawn)
# By default disabled / По умолчанию выключено
spawn:
  enabled: false
  world: "world"
  x: 0.5
  y: 64.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0

# Hub command configuration / Настройка точки хаба (/hub)
# By default disabled / По умолчанию выключено
hub:
  enabled: false
  world: "world"
  x: 0.5
  y: 64.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0

# Disabled worlds configuration / Настройка миров, в которых /tpa отключен
# По умолчанию выключено (default: false)
disabled-worlds:
  # Enable world restriction / Включить ограничение по мирам
  enabled: false

  # Ignore bypass permission for OPs (true = OPs cannot bypass either)
  # Игнорировать право обхода для операторов (true = у OP тоже запрещено)
  ignore-bypass: true

  # List of world names or environment types / Список отключенных миров или типов измерений
  # Можно указывать как точное название мира, так и тип измерения:
  #   - "world"        (название мира)
  #   - "world_nether" (название мира)
  #   - "NORMAL"       (по типу измерения - обычный мир)
  #   - "NETHER"       (по типу измерения - ад)
  #   - "THE_END"      (по типу измерения - край)
  worlds:
    - "world_nether"
    - "world_the_end"
    - "pvp_arena"

# Teleportation request settings / Настройки запросов на телепортацию
requests:
  # Request expiration time in seconds (0 to disable expiration)
  # Время действия запроса в секундах (0 - бессрочно)
  timeout: 0

  # Warmup delay before teleporting in seconds (0 = instant teleport)
  # Задержка перед телепортацией в секундах (0 = мгновенно)
  teleport-delay: 0

  # Cancel teleportation if player moves during warmup
  # Отменять телепортацию при движении во время задержки
  cancel-on-movement: true

  # Cancel teleportation if player takes damage during warmup
  # Отменять телепортацию при получении урона во время задержки
  cancel-on-damage: true

# Safety checks before teleporting / Проверки безопасности перед телепортацией
safe-teleport:
  # Enable safety checks
  # Включить проверку безопасности точки приземления
  enabled: true

  # Prevent teleporting into lava
  # Запретить телепортацию в лаву
  prevent-lava: true

  # Prevent teleporting into the void
  # Запретить телепортацию в пустоту
  prevent-void: true
